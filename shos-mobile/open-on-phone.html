<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SHOS Mobile — Open on Expo Go</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      max-width: 420px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #38bdf8;
    }
    p {
      font-size: 15px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .qr-container {
      background: white;
      padding: 16px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 24px;
    }
    .url-box {
      background: #0f172a;
      padding: 12px 16px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 14px;
      color: #10b981;
      word-break: break-all;
      border: 1px solid #334155;
    }
    .badge {
      display: inline-block;
      background: #0284c7;
      color: white;
      font-size: 12px;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">EXPO SDK 54 READY</div>
    <h1>SHOS Mobile</h1>
    <p>Scan with <strong>Expo Go (SDK 54)</strong> or enter the URL manually in the Expo Go app.</p>
    
    <div class="qr-container">
      <img id="qr-image" src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=exp%3A%2F%2F172.29.17.206%3A8081" alt="Expo Go QR Code" width="240" height="240" />
    </div>

    <p style="margin-bottom: 8px; font-size: 13px;">Or tap <strong>Enter URL manually</strong> in Expo Go:</p>
    <div class="url-box" id="url-box">exp://172.29.17.206:8081</div>
  </div>

  <script>
    // Automatically adjust if accessed via another host IP
    if (window.location.hostname && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
      const host = window.location.hostname;
      const url = `exp://${host}:8081`;
      document.getElementById('url-box').textContent = url;
      document.getElementById('qr-image').src = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(url)}`;
    }
  </script>
</body>
</html>
